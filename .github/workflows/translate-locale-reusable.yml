name: Translate Locale Reusable

on:
  # Manual dispatch is the STORY-06 canary drill entry: every input defaults
  # to the original failure path, so a default dispatch behaves exactly like
  # the pre-canary workflow (relay disabled, no new publish behavior).
  workflow_dispatch:
    inputs:
      locale:
        required: true
        type: string
      locale_slug:
        required: true
        type: string
      publish_ref:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      mode:
        required: true
        type: string
      shard_index:
        required: true
        type: string
      shard_total:
        required: true
        type: string
      worker_parallel:
        required: true
        type: string
      thinking_effort:
        required: true
        type: string
      pending_limit:
        required: false
        default: "0"
        type: string
      canary_source_path:
        required: false
        default: ""
        type: string
      artifact_prefix:
        required: false
        default: i18n
        type: string
      artifact_role:
        required: false
        default: locale
        type: string
      commit_locale:
        required: false
        default: false
        type: boolean
      canary_live_path:
        required: false
        default: channels/line
        type: string
      canary_expected_h1:
        required: false
        default: LINE
        type: string
      canary_publish_required:
        required: false
        default: false
        type: boolean
      max_attempts:
        required: false
        default: "5"
        type: string
      log_rejected_body:
        required: false
        default: false
        type: boolean
      mdx_repair_enabled:
        required: false
        default: false
        type: boolean
      canary_locales:
        required: false
        default: ""
        type: string
      canary_paths:
        required: false
        default: ""
        type: string
      canary_gate_failure_policy:
        required: false
        default: fallback
        type: string
  workflow_call:
    inputs:
      locale:
        required: true
        type: string
      locale_slug:
        required: true
        type: string
      publish_ref:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      mode:
        required: true
        type: string
      shard_index:
        required: true
        type: string
      shard_total:
        required: true
        type: string
      worker_parallel:
        required: true
        type: string
      thinking_effort:
        required: true
        type: string
      pending_limit:
        required: false
        default: "0"
        type: string
      canary_source_path:
        required: false
        default: ""
        type: string
      artifact_prefix:
        required: false
        default: i18n
        type: string
      artifact_role:
        required: false
        default: locale
        type: string
      commit_locale:
        required: false
        default: false
        type: boolean
      canary_live_path:
        required: false
        default: channels/line
        type: string
      canary_expected_h1:
        required: false
        default: LINE
        type: string
      canary_publish_required:
        required: false
        default: false
        type: boolean
      max_attempts:
        required: false
        default: "5"
        type: string
      log_rejected_body:
        required: false
        default: false
        type: boolean
      # STORY-06 canary switch: the enhanced repair relay only starts when
      # this master switch is on AND the shard sits inside both canary
      # whitelists AND the mdx-repair-gate validation finished successfully.
      # Default false keeps the original failure path byte-equivalent.
      mdx_repair_enabled:
        required: false
        default: false
        type: boolean
      canary_locales:
        required: false
        default: ""
        type: string
      canary_paths:
        required: false
        default: ""
        type: string
      canary_gate_failure_policy:
        required: false
        default: fallback
        type: string

# D-09 budget for the bounded Codex MDX repair relay (single entry:
# openai/codex-action@v1). Both relay budgets are explicit overrides with
# these approved defaults; mdx_repair_relay.py fails closed on invalid values.
env:
  MDX_REPAIR_MAX_ATTEMPTS: "4"
  MDX_REPAIR_HARD_TIMEOUT_MS: "600000"
  # Auxiliary repair arms stay out of production (D-09: fail-closed);
  # mdx_repair_relay.py aborts the relay if MDX_REPAIR_AUXILIARY_MODE is set
  # to anything besides none.
  MDX_REPAIR_AUXILIARY_MODE: "none"

jobs:
  translate:
    name: Translate ${{ inputs.locale }} shard ${{ inputs.shard_index }}/${{ inputs.shard_total }}
    # STORY-06: the RELEASE gate runs first when the canary switch is on; a
    # skipped gate (switch off) must not block the original path, and a
    # failed gate only continues under the fallback policy.
    needs: mdx-repair-gate
    if: >-
      needs.mdx-repair-gate.result == 'skipped' ||
      needs.mdx-repair-gate.result == 'success' ||
      (needs.mdx-repair-gate.result == 'failure' && inputs.canary_gate_failure_policy == 'fallback')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    concurrency:
      group: translate-${{ inputs.locale_slug }}-s${{ inputs.shard_index }}of${{ inputs.shard_total }}
      cancel-in-progress: false
    steps:
      # Keep workflow control-plane scripts pinned to the workflow ref. The docs
      # content checkout below may intentionally point at latest main.
      - name: Check out workflow scripts
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .openclaw-sync/workflow-ref
          sparse-checkout: .github/scripts/i18n
          persist-credentials: false

      - name: Stage workflow scripts
        run: |
          set -euo pipefail
          I18N_SCRIPT_DIR="${RUNNER_TEMP}/openclaw-i18n-scripts"
          echo "I18N_SCRIPT_DIR=${I18N_SCRIPT_DIR}" >> "$GITHUB_ENV"
          mkdir -p "${I18N_SCRIPT_DIR}"
          cp -R .openclaw-sync/workflow-ref/.github/scripts/i18n/. "${I18N_SCRIPT_DIR}/"

      - name: Checkout publish repo
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.publish_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read source metadata
        id: meta
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python "${I18N_SCRIPT_DIR}/read_source_metadata.py"

      - name: Allow requested source
        id: stale
        run: |
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout source repo
        if: steps.stale.outputs.skip != 'true'
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ steps.meta.outputs.repository }}
          ref: ${{ steps.meta.outputs.sha }}
          path: source
          fetch-depth: 1

      - name: Setup Node
        if: steps.stale.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Go
        if: steps.stale.outputs.skip != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Install Codex CLI
        if: steps.stale.outputs.skip != 'true'
        run: npm install -g @openai/codex@0.146.1

      - name: Prune stale locale pages
        if: steps.stale.outputs.skip != 'true'
        env:
          LOCALE: ${{ inputs.locale }}
        run: |
          python "${I18N_SCRIPT_DIR}/prune_stale_locale_pages.py"

      - name: Build pending docs file list
        id: pending
        if: steps.stale.outputs.skip != 'true'
        env:
          LOCALE: ${{ inputs.locale }}
          LOCALE_SLUG: ${{ inputs.locale_slug }}
          MODE: ${{ inputs.mode }}
          SHARD_INDEX: ${{ inputs.shard_index }}
          SHARD_TOTAL: ${{ inputs.shard_total }}
          PENDING_LIMIT: ${{ inputs.pending_limit }}
          CANARY_SOURCE_PATH: ${{ inputs.canary_source_path }}
        run: |
          python "${I18N_SCRIPT_DIR}/build_pending_manifest.py"

      # STORY-06 canary switch: fail-closed scope decision for the enhanced
      # relay. With the switch off this only records the decision and sets
      # MDX_REPAIR_CANARY_ENABLED=false so every relay step below keeps the
      # original failure path (skipped exactly as before the relay existed).
      - name: Decide canary MDX repair scope
        id: mdx_canary
        if: steps.stale.outputs.skip != 'true'
        env:
          LOCALE: ${{ inputs.locale }}
          LOCALE_SLUG: ${{ inputs.locale_slug }}
          SHARD_INDEX: ${{ inputs.shard_index }}
          SHARD_TOTAL: ${{ inputs.shard_total }}
          MDX_REPAIR_ENABLED_INPUT: ${{ inputs.mdx_repair_enabled }}
          CANARY_LOCALES: ${{ inputs.canary_locales }}
          CANARY_PATHS: ${{ inputs.canary_paths }}
          CANARY_GATE_FAILURE_POLICY: ${{ inputs.canary_gate_failure_policy }}
          MDX_REPAIR_GATE_RESULT: ${{ needs.mdx-repair-gate.result }}
        run: |
          python "${I18N_SCRIPT_DIR}/mdx_repair_canary.py" decide

      - name: Translate changed docs into locale
        id: translate_docs
        if: steps.stale.outputs.skip != 'true' && steps.pending.outputs.pending_count != '0'
        continue-on-error: true
        env:
          LOCALE: ${{ inputs.locale }}
          LOCALE_SLUG: ${{ inputs.locale_slug }}
          MODE: ${{ inputs.mode }}
          OPENAI_API_KEY: ${{ secrets.OPENCLAW_DOCS_I18N_OPENAI_API_KEY }}
          OPENCLAW_DOCS_I18N_PROVIDER: openai
          OPENCLAW_DOCS_I18N_MODEL: gpt-5.6
          OPENCLAW_DOCS_I18N_PROMPT_TIMEOUT: 10m
          # Owned by source/scripts/docs-i18n; diagnostics opt in per canary.
          OPENCLAW_DOCS_I18N_LOG_REJECTED_BODY: ${{ inputs.log_rejected_body && '1' || '0' }}
          WORKER_PARALLEL: ${{ inputs.worker_parallel }}
          THINKING_EFFORT: ${{ inputs.thinking_effort }}
        run: |
          pending_file=".openclaw-sync/docs-i18n-${LOCALE_SLUG}-s${{ inputs.shard_index }}of${{ inputs.shard_total }}.txt"
          if [ ! -s "${pending_file}" ]; then
            echo "No docs files found."
            exit 0
          fi

          mapfile -t DOC_FILES < "${pending_file}"
          if [ "${MODE}" = "full" ]; then
            python "${I18N_SCRIPT_DIR}/clear_pending_locale_outputs.py" \
              --pending-file "${pending_file}" \
              --locale "${LOCALE}"
          fi

          attempt=1
          max_attempts="${{ inputs.max_attempts }}"
          if ! [[ "${max_attempts}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid translation max_attempts: ${max_attempts}" >&2
            exit 1
          fi
          while [ "$attempt" -le "$max_attempts" ]; do
            PARTIAL_ARGS=(--allow-partial)
            if [ "${MODE}" = "full" ] && [ "$attempt" -eq 1 ]; then
              PARTIAL_ARGS+=(--overwrite)
            fi

            echo "docs-i18n partial attempt $attempt/$max_attempts"
            if ! (
              cd source/scripts/docs-i18n
              go run . \
                --docs "$GITHUB_WORKSPACE/docs" \
                --lang "${LOCALE}" \
                --src en \
                --mode doc \
                --thinking "${THINKING_EFFORT}" \
                --parallel "${WORKER_PARALLEL}" \
                "${PARTIAL_ARGS[@]}" \
                "${DOC_FILES[@]}"
            ); then
              echo "docs-i18n partial attempt $attempt/$max_attempts reported failures; checking preserved progress."
            fi

            echo "docs-i18n strict completion check $attempt/$max_attempts"
            if (
              cd source/scripts/docs-i18n
              go run . \
                --docs "$GITHUB_WORKSPACE/docs" \
                --lang "${LOCALE}" \
                --src en \
                --mode doc \
                --thinking "${THINKING_EFFORT}" \
                --parallel "${WORKER_PARALLEL}" \
                "${DOC_FILES[@]}"
            ); then
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "docs-i18n failed after $max_attempts attempts"
              exit 1
            fi

            attempt=$((attempt + 1))
            sleep 5
          done

      - name: Install docs MDX checker dependency
        if: steps.stale.outputs.skip != 'true' && steps.pending.outputs.pending_count != '0' && steps.translate_docs.outcome == 'success'
        run: npm install --no-save --package-lock=false @mdx-js/mdx@3.1.1

      - name: Check translated MDX
        id: mdx_check
        if: steps.stale.outputs.skip != 'true' && steps.pending.outputs.pending_count != '0' && steps.translate_docs.outcome == 'success'
        continue-on-error: true
        env:
          LOCALE: ${{ inputs.locale }}
        run: |
          mkdir -p .openclaw-sync/mdx
          node .openclaw-sync/check-docs-mdx.mjs "docs/${LOCALE}" \
            --json-out ".openclaw-sync/mdx/${LOCALE}.json" \
            --max-errors 500

      # Contract startup conditions (plans/i18n-codex-mdx-fallback §1): the
      # single repair action only starts on complete pages when the strict
      # check failed, the pending manifest is non-empty, and compile
      # diagnostics exist inside docs/<locale>. Otherwise not_run is recorded.
      - name: Decide MDX repair relay
        id: mdx_relay
        if: steps.stale.outputs.skip != 'true' && steps.translate_docs.outcome == 'success' && steps.mdx_check.outcome == 'failure' && env.MDX_REPAIR_CANARY_ENABLED == 'true'
        env:
          LOCALE: ${{ inputs.locale }}
          LOCALE_SLUG: ${{ inputs.locale_slug }}
          SHARD_INDEX: ${{ inputs.shard_index }}
          SHARD_TOTAL: ${{ inputs.shard_total }}
          MDX_CHECK_OUTCOME: ${{ steps.mdx_check.outcome }}
        run: |
          python "${I18N_SCRIPT_DIR}/mdx_repair_relay.py" decide

      - name: Snapshot translated MDX repair scope
        if: steps.stale.outputs.skip != 'true' && steps.translate_docs.outcome == 'success' && steps.mdx_check.outcome == 'failure' && env.MDX_REPAIR_CANARY_ENABLED == 'true'
        env:
          LOCALE: ${{ inputs.locale }}
        run: |
          python "${I18N_SCRIPT_DIR}/mdx_repair_scope.py" snapshot \
            --baseline "${RUNNER_TEMP}/${LOCALE}.repair-baseline.txt"

      # Relay round 1 of at most MDX_REPAIR_MAX_ATTEMPTS (D-09). The action
      # reads the current diagnostics file; every later round is fed the
      # previous round's recheck diagnostics through the same file.
      - name: Repair translated MDX
        id: mdx_repair
        if: steps.stale.outputs.skip != 'true' && steps.translate_docs.outcome == 'success' && steps.mdx_check.outcome == 'failure' && steps.mdx_relay.outputs.decision == 'run' && env.MDX_REPAIR_MAX_ATTEMPTS >= 1 && env.MDX_REPAIR_CANARY_ENABLED == 'true'
        continue-on-error: true
        # Per-round hard budget: HARD_TIMEOUT_MS (default 600000) plus runner margin.
        timeout-minutes: 12
        uses: openai/codex-action@v1
        env:
          LOCALE: ${{ inputs.locale }}
          MDX_REPAIR_ROUND: "1"
        with:
          openai-api-key: ${{ secrets.OPENCLAW_DOCS_AGENT_OPENAI_API_KEY || secrets.OPENCLAW_DOCS_I18N_OPENAI_API_KEY }}
          prompt-file: .openclaw-sync/docs-mdx-repair.md
          model: gpt-5.6
          effort: xhigh
          sandbox: workspace-write
          safety-strategy: drop-sudo
          codex-args: '["--full-auto"]'

      - name: Enforce translated MDX repair scope
        id: mdx_scope
        if: steps.stale.outputs.skip != 'true' && steps.translate_docs.outcome == 'success' && steps.mdx_check.outcome == 'failure' && steps.mdx_relay.outputs.decision == 'run' && env.MDX_REPAIR_CANARY_ENABLED == 'true'
        continue-on-error: true
        env:
          LOCALE: ${{ inputs.locale }}
        run: |
          python "${I18N_SCRIPT_DIR}/mdx_repair_scope.py" enforce \
            --baseline "${RUNNER_TEMP}/${LOCALE}.repair-baseline.txt"

      - name: Recheck translated MDX
        id: mdx_recheck
        if: steps.stale.outputs.skip != 'true' && steps.translate_docs.outcome == 'success' && steps.mdx_check.outcome == 'failure' && steps.mdx_repair.outcome == 'success' && steps.mdx_scope.outcome == 'success' && env.MDX_REPAIR_CANARY_ENABLED == 'true'
        continue-on-error: true
        env:
          LOCALE: ${{ inputs.locale }}
        run: |
          set +e
          node .openclaw-sync/check-docs-mdx.mjs "docs/${LOCALE}" \
            --json-out ".openclaw-sync/mdx/${LOCALE}.json" \
            --max-errors 500
          recheck_status=$?
          cp ".openclaw-sync/mdx/${LOCALE}.json" ".openclaw-sync/mdx/${LOCALE}-round-1.json"
          exit "$recheck_status"

      # Relay rounds 2..MDX_REPAIR_MAX_ATTEMPTS: each round only starts when
      # the previous round's recheck still failed, so the diagnostics file the
      # action reads always carries that round's fed-back diagnostics. Every
      # round stays inside the same single repair entry and its gates.
      - name: Repair translated MDX (relay round 2)
        id: mdx_repair_2
        if: >-
          steps.stale.outputs.skip != 'true' && steps.translate_docs.outcome == 'success' &&
          steps.mdx_check.outcome == 'failure' && steps.mdx_relay.outputs.decision == 'run' &&
          env.MDX_REPAIR_MAX_ATTEMPTS >= 2 && steps.mdx_repair.outcome == 'success' &&
          steps.mdx_scope.outcome == 'success' && steps.mdx_recheck.outcome == 'failure' &&
          env.MDX_REPAIR_CANARY_ENABLED == 'true'
        continue-on-error: true
        timeout-minutes: 12
        uses: openai/codex-action@v1
        env:
          LOCALE: ${{ inputs.locale }}
          MDX_REPAIR_ROUND: "2"
        with:
          openai-api-key: ${{ secrets.OPENCLAW_DOCS_AGENT_OPENAI_API_KEY || secrets.OPENCLAW_DOCS_I18N_OPENAI_API_KEY }}
          prompt-file: .openclaw-sync/docs-mdx-repair.md
          model: gpt-5.6
          effort: xhigh
          sandbox: workspace-write
          safety-strategy: drop-sudo
          codex-args: '["--full-auto"]'

      - name: Enforce translated MDX repair scope (relay round 2)
        id: mdx_scope_2
        if: >-
          steps.stale.outputs.skip != 'true' && steps.translate_docs.outcome == 'success' &&
          steps.mdx_check.outcome == 'failure' && steps.mdx_relay.outputs.decision == 'run' &&
          env.MDX_REPAIR_MAX_ATTEMPTS >= 2 && steps.mdx_repair.outcome == 'success' &&
          steps.mdx_scope.outcome == 'success' && steps.mdx_recheck.outcome == 'failure' &&
          steps.mdx_repair_2.outcome == 'success' &&
          env.MDX_REPAIR_CANARY_ENABLED == 'true'
        continue-on-error: true
        env:
          LOCALE: ${{ inputs.locale }}
        run: |
          python "${I18N_SCRIPT_DIR}/mdx_repair_scope.py" enforce \
            --baseline "${RUNNER_TEMP}/${LOCALE}.repair-baseline.txt"

      - name: Recheck translated MDX (relay round 2)
        id: mdx_recheck_2
        if: >-
          steps.stale.outputs.skip != 'true' && steps.translate_docs.outcome == 'success' &&
          steps.mdx_check.outcome == 'failure' && steps.mdx_relay.outputs.decision == 'run' &&
          env.MDX_REPAIR_MAX_ATTEMPTS >= 2 && steps.mdx_repair.outcome == 'success' &&
          steps.mdx_scope.outcome == 'success' && steps.mdx_recheck.outcome == 'failure' &&
          steps.mdx_repair_2.outcome == 'success' && steps.mdx_scope_2.outcome == 'success' &&
          env.MDX_REPAIR_CANARY_ENABLED == 'true'
        continue-on-error: true
        env:
          LOCALE: ${{ inputs.locale }}
        run: |
          set +e
          node .openclaw-sync/check-docs-mdx.mjs "docs/${LOCALE}" \
            --json-out ".openclaw-sync/mdx/${LOCALE}.json" \
            --max-errors 500
          recheck_status=$?
          cp ".openclaw-sync/mdx/${LOCALE}.json" ".openclaw-sync/mdx/${LOCALE}-round-2.json"
          exit "$recheck_status"

      - name: Repair translated MDX (relay round 3)
        id: mdx_repair_3
        if: >-
          steps.stale.outputs.skip != 'true' && steps.translate_docs.outcome == 'success' &&
          steps.mdx_check.outcome == 'failure' && steps.mdx_relay.outputs.decision == 'run' &&
          env.MDX_REPAIR_MAX_ATTEMPTS >= 3 && steps.mdx_repair_2.outcome == 'success' &&
          steps.mdx_scope_2.outcome == 'success' && steps.mdx_recheck_2.outcome == 'failure' &&
          env.MDX_REPAIR_CANARY_ENABLED == 'true'
        continue-on-error: true
        timeout-minutes: 12
        uses: openai/codex-action@v1
        env:
          LOCALE: ${{ inputs.locale }}
          MDX_REPAIR_ROUND: "3"
        with:
          openai-api-key: ${{ secrets.OPENCLAW_DOCS_AGENT_OPENAI_API_KEY || secrets.OPENCLAW_DOCS_I18N_OPENAI_API_KEY }}
          prompt-file: .openclaw-sync/docs-mdx-repair.md
          model: gpt-5.6
          effort: xhigh
          sandbox: workspace-write
          safety-strategy: drop-sudo
          codex-args: '["--full-auto"]'

      - name: Enforce translated MDX repair scope (relay round 3)
        id: mdx_scope_3
        if: >-
          steps.stale.outputs.skip != 'true' && steps.translate_docs.outcome == 'success' &&
          steps.mdx_check.outcome == 'failure' && steps.mdx_relay.outputs.decision == 'run' &&
          env.MDX_REPAIR_MAX_ATTEMPTS >= 3 && steps.mdx_repair_2.outcome == 'success' &&
          steps.mdx_scope_2.outcome == 'success' && steps.mdx_recheck_2.outcome == 'failure' &&
          steps.mdx_repair_3.outcome == 'success' &&
          env.MDX_REPAIR_CANARY_ENABLED == 'true'
        continue-on-error: true
        env:
          LOCALE: ${{ inputs.locale }}
        run: |
          python "${I18N_SCRIPT_DIR}/mdx_repair_scope.py" enforce \
            --baseline "${RUNNER_TEMP}/${LOCALE}.repair-baseline.txt"

      - name: Recheck translated MDX (relay round 3)
        id: mdx_recheck_3
        if: >-
          steps.stale.outputs.skip != 'true' && steps.translate_docs.outcome == 'success' &&
          steps.mdx_check.outcome == 'failure' && steps.mdx_relay.outputs.decision == 'run' &&
          env.MDX_REPAIR_MAX_ATTEMPTS >= 3 && steps.mdx_repair_2.outcome == 'success' &&
          steps.mdx_scope_2.outcome == 'success' && steps.mdx_recheck_2.outcome == 'failure' &&
          steps.mdx_repair_3.outcome == 'success' && steps.mdx_scope_3.outcome == 'success' &&
          env.MDX_REPAIR_CANARY_ENABLED == 'true'
        continue-on-error: true
        env:
          LOCALE: ${{ inputs.locale }}
        run: |
          set +e
          node .openclaw-sync/check-docs-mdx.mjs "docs/${LOCALE}" \
            --json-out ".openclaw-sync/mdx/${LOCALE}.json" \
            --max-errors 500
          recheck_status=$?
          cp ".openclaw-sync/mdx/${LOCALE}.json" ".openclaw-sync/mdx/${LOCALE}-round-3.json"
          exit "$recheck_status"

      - name: Repair translated MDX (relay round 4)
        id: mdx_repair_4
        if: >-
          steps.stale.outputs.skip != 'true' && steps.translate_docs.outcome == 'success' &&
          steps.mdx_check.outcome == 'failure' && steps.mdx_relay.outputs.decision == 'run' &&
          env.MDX_REPAIR_MAX_ATTEMPTS >= 4 && steps.mdx_repair_3.outcome == 'success' &&
          steps.mdx_scope_3.outcome == 'success' && steps.mdx_recheck_3.outcome == 'failure' &&
          env.MDX_REPAIR_CANARY_ENABLED == 'true'
        continue-on-error: true
        timeout-minutes: 12
        uses: openai/codex-action@v1
        env:
          LOCALE: ${{ inputs.locale }}
          MDX_REPAIR_ROUND: "4"
        with:
          openai-api-key: ${{ secrets.OPENCLAW_DOCS_AGENT_OPENAI_API_KEY || secrets.OPENCLAW_DOCS_I18N_OPENAI_API_KEY }}
          prompt-file: .openclaw-sync/docs-mdx-repair.md
          model: gpt-5.6
          effort: xhigh
          sandbox: workspace-write
          safety-strategy: drop-sudo
          codex-args: '["--full-auto"]'

      - name: Enforce translated MDX repair scope (relay round 4)
        id: mdx_scope_4
        if: >-
          steps.stale.outputs.skip != 'true' && steps.translate_docs.outcome == 'success' &&
          steps.mdx_check.outcome == 'failure' && steps.mdx_relay.outputs.decision == 'run' &&
          env.MDX_REPAIR_MAX_ATTEMPTS >= 4 && steps.mdx_repair_3.outcome == 'success' &&
          steps.mdx_scope_3.outcome == 'success' && steps.mdx_recheck_3.outcome == 'failure' &&
          steps.mdx_repair_4.outcome == 'success' &&
          env.MDX_REPAIR_CANARY_ENABLED == 'true'
        continue-on-error: true
        env:
          LOCALE: ${{ inputs.locale }}
        run: |
          python "${I18N_SCRIPT_DIR}/mdx_repair_scope.py" enforce \
            --baseline "${RUNNER_TEMP}/${LOCALE}.repair-baseline.txt"

      - name: Recheck translated MDX (relay round 4)
        id: mdx_recheck_4
        if: >-
          steps.stale.outputs.skip != 'true' && steps.translate_docs.outcome == 'success' &&
          steps.mdx_check.outcome == 'failure' && steps.mdx_relay.outputs.decision == 'run' &&
          env.MDX_REPAIR_MAX_ATTEMPTS >= 4 && steps.mdx_repair_3.outcome == 'success' &&
          steps.mdx_scope_3.outcome == 'success' && steps.mdx_recheck_3.outcome == 'failure' &&
          steps.mdx_repair_4.outcome == 'success' && steps.mdx_scope_4.outcome == 'success' &&
          env.MDX_REPAIR_CANARY_ENABLED == 'true'
        continue-on-error: true
        env:
          LOCALE: ${{ inputs.locale }}
        run: |
          set +e
          node .openclaw-sync/check-docs-mdx.mjs "docs/${LOCALE}" \
            --json-out ".openclaw-sync/mdx/${LOCALE}.json" \
            --max-errors 500
          recheck_status=$?
          cp ".openclaw-sync/mdx/${LOCALE}.json" ".openclaw-sync/mdx/${LOCALE}-round-4.json"
          exit "$recheck_status"

      # Classifies the relay outcome for artifact metadata and partial-success
      # protection (AC-05): per-page failures stay explicitly marked while the
      # shard's passing pages are packaged normally.
      - name: Record MDX repair relay outcome
        id: mdx_repair_report
        if: steps.stale.outputs.skip != 'true' && steps.translate_docs.outcome == 'success' && steps.mdx_check.outcome == 'failure' && env.MDX_REPAIR_CANARY_ENABLED == 'true'
        env:
          LOCALE: ${{ inputs.locale }}
          LOCALE_SLUG: ${{ inputs.locale_slug }}
          SHARD_INDEX: ${{ inputs.shard_index }}
          SHARD_TOTAL: ${{ inputs.shard_total }}
          MDX_CHECK_OUTCOME: ${{ steps.mdx_check.outcome }}
          # Three outcome tokens per relay round: action scope recheck.
          MDX_REPAIR_ROUNDS_OUTCOMES: "${{ steps.mdx_repair.outcome || 'skipped' }} ${{ steps.mdx_scope.outcome || 'skipped' }} ${{ steps.mdx_recheck.outcome || 'skipped' }} ${{ steps.mdx_repair_2.outcome || 'skipped' }} ${{ steps.mdx_scope_2.outcome || 'skipped' }} ${{ steps.mdx_recheck_2.outcome || 'skipped' }} ${{ steps.mdx_repair_3.outcome || 'skipped' }} ${{ steps.mdx_scope_3.outcome || 'skipped' }} ${{ steps.mdx_recheck_3.outcome || 'skipped' }} ${{ steps.mdx_repair_4.outcome || 'skipped' }} ${{ steps.mdx_scope_4.outcome || 'skipped' }} ${{ steps.mdx_recheck_4.outcome || 'skipped' }}"
        run: |
          python "${I18N_SCRIPT_DIR}/mdx_repair_relay.py" report

      - name: Prepare locale artifact
        id: package
        if: steps.stale.outputs.skip != 'true'
        env:
          LOCALE: ${{ inputs.locale }}
          LOCALE_SLUG: ${{ inputs.locale_slug }}
          SOURCE_SHA: ${{ steps.meta.outputs.sha }}
          MODE: ${{ inputs.mode }}
          SHARD_INDEX: ${{ inputs.shard_index }}
          SHARD_TOTAL: ${{ inputs.shard_total }}
          WORKER_PARALLEL: ${{ inputs.worker_parallel }}
          THINKING_EFFORT: ${{ inputs.thinking_effort }}
          PENDING_COUNT: ${{ steps.pending.outputs.pending_count || '0' }}
          TOTAL_PENDING_COUNT: ${{ steps.pending.outputs.total_pending_count || '0' }}
          ALL_COUNT: ${{ steps.pending.outputs.all_count || '0' }}
          TRANSLATE_OUTCOME: ${{ steps.translate_docs.outcome || 'skipped' }}
          MDX_CHECK_OUTCOME: ${{ steps.mdx_check.outcome || 'skipped' }}
          MDX_REPAIR_OUTCOME: ${{ steps.mdx_repair.outcome || 'skipped' }}
          MDX_SCOPE_OUTCOME: ${{ steps.mdx_scope.outcome || 'skipped' }}
          MDX_RECHECK_OUTCOME: ${{ steps.mdx_repair_report.outputs.recheck_outcome || steps.mdx_recheck.outcome || 'skipped' }}
          MDX_REPAIR_FINAL_OUTCOME: ${{ steps.mdx_repair_report.outputs.final_outcome || 'not_run' }}
          MDX_REPAIR_FAILURE_KIND: ${{ steps.mdx_repair_report.outputs.failure_kind || 'none' }}
          MDX_REPAIR_MODE: ${{ steps.mdx_repair_report.outputs.repair_mode || 'none' }}
          MDX_REPAIR_ROUNDS: ${{ steps.mdx_repair_report.outputs.rounds || '0' }}
          MDX_REPAIR_FAILED_PATHS: ${{ steps.mdx_repair_report.outputs.failed_paths || '' }}
          MDX_REPAIR_NONSYNTAX_FAILED_PATHS: ${{ steps.mdx_repair_report.outputs.nonsyntax_failed_paths || '' }}
          MDX_REPAIR_CHANGED_PATHS: ${{ steps.mdx_repair_report.outputs.changed_paths || '' }}
          ARTIFACT_ROLE: ${{ inputs.artifact_role }}
        run: |
          set -euo pipefail

          python "${I18N_SCRIPT_DIR}/package_artifact.py"

      - name: Upload locale artifact
        if: steps.stale.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-${{ inputs.locale_slug }}-s${{ inputs.shard_index }}of${{ inputs.shard_total }}-${{ inputs.source_sha }}
          path: .openclaw-sync/artifacts/${{ inputs.locale_slug }}-s${{ inputs.shard_index }}of${{ inputs.shard_total }}
          include-hidden-files: true
          retention-days: 7

      - name: Fail failed locale artifact
        if: steps.stale.outputs.skip != 'true' && steps.package.outputs.failed == 'true'
        env:
          FAILED_REASON: ${{ steps.package.outputs.failed_reason }}
        run: |
          {
            echo "Locale artifact records a failed translation."
            echo "Failure: ${FAILED_REASON}"
            echo "The artifact was uploaded before failing this job so the status and artifact contract stay aligned."
          } >&2
          exit 1

  # STORY-06 RELEASE gate signal: when the canary switch is on and the locale
  # is whitelisted, the frozen-fixture validation sub-pipeline must prove the
  # repair chain inside this same run before any canary content is finalized
  # (STORY-05 contract: classification success/agent_failure/environment_
  # failure, artifacts mdx-repair-validation-*-<run_id>). The job fails
  # unless the classification is success.
  mdx-repair-gate:
    name: MDX repair validation gate (${{ inputs.locale }})
    permissions:
      contents: read
    if: >-
      inputs.mdx_repair_enabled == true &&
      contains(format(',{0},', inputs.canary_locales), format(',{0},', inputs.locale))
    uses: ./.github/workflows/mdx-repair-validation.yml
    with:
      real_codex: true
    secrets: inherit

  commit-locale:
    name: Finalize ${{ inputs.locale }} artifact
    needs:
      - translate
      - mdx-repair-gate
    if: >-
      needs.translate.result == 'success' &&
      (
        needs.mdx-repair-gate.result == 'skipped' ||
        needs.mdx-repair-gate.result == 'success' ||
        (needs.mdx-repair-gate.result == 'failure' && inputs.canary_gate_failure_policy == 'fallback')
      ) &&
      (inputs.commit_locale || (inputs.artifact_role == 'canary' && inputs.canary_publish_required))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: write
    steps:
      # Finalizers apply artifacts to latest main, but deploy/commit control
      # logic must come from this workflow ref so branch canaries test the fix.
      - name: Check out workflow scripts
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .openclaw-sync/workflow-ref
          sparse-checkout: .github/scripts/i18n
          persist-credentials: false

      - name: Stage workflow scripts
        run: |
          set -euo pipefail
          I18N_SCRIPT_DIR="${RUNNER_TEMP}/openclaw-i18n-scripts"
          echo "I18N_SCRIPT_DIR=${I18N_SCRIPT_DIR}" >> "$GITHUB_ENV"
          mkdir -p "${I18N_SCRIPT_DIR}"
          cp -R .openclaw-sync/workflow-ref/.github/scripts/i18n/. "${I18N_SCRIPT_DIR}/"

      - name: Check out latest main
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # STORY-06: the RELEASE gate consumes the validation classification
      # (artifact mdx-repair-validation-real-codex-<run_id>) before anything
      # is committed or published. Only classification=success passes;
      # agent_failure/environment_failure are recorded and then either fall
      # back (original failure path) or abort the canary per policy.
      - name: Download MDX repair validation evidence
        if: needs.mdx-repair-gate.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: mdx-repair-validation-real-codex-${{ github.run_id }}
          path: .openclaw-sync/mdx-repair-gate

      - name: Consume MDX repair release gate
        id: mdx_release_gate
        if: needs.mdx-repair-gate.result != 'skipped'
        env:
          CANARY_GATE_FAILURE_POLICY: ${{ inputs.canary_gate_failure_policy }}
          MDX_REPAIR_GATE_RESULT: ${{ needs.mdx-repair-gate.result }}
        run: |
          python "${I18N_SCRIPT_DIR}/mdx_repair_canary.py" gate \
            --evidence-dir .openclaw-sync/mdx-repair-gate

      - name: Download locale artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_prefix }}-${{ inputs.locale_slug }}-s${{ inputs.shard_index }}of${{ inputs.shard_total }}-${{ inputs.source_sha }}
          path: .openclaw-sync/i18n-artifacts/${{ inputs.locale_slug }}-s${{ inputs.shard_index }}of${{ inputs.shard_total }}

      - name: Apply locale artifact
        id: apply
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          MODE: ${{ inputs.mode }}
          SHARD_TOTAL: ${{ inputs.shard_total }}
          EXPECTED_LOCALES: ${{ inputs.locale_slug }}=${{ inputs.locale }}
        run: |
          set -euo pipefail

          python "${I18N_SCRIPT_DIR}/apply_artifacts.py" \
            --source-sha "${SOURCE_SHA}" \
            --mode "${MODE}" \
            --shard-total "${SHARD_TOTAL}" \
            --expected-locales "${EXPECTED_LOCALES}"

      - name: Set up Node for locale validation
        if: inputs.artifact_role != 'canary' && steps.apply.outputs.changed_count != '0'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install docs dependencies
        if: inputs.artifact_role != 'canary' && steps.apply.outputs.changed_count != '0'
        run: npm ci

      - name: Install validation system dependencies
        if: inputs.artifact_role != 'canary' && steps.apply.outputs.changed_count != '0'
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Install Playwright browser
        if: inputs.artifact_role != 'canary' && steps.apply.outputs.changed_count != '0'
        run: npx playwright install --with-deps chromium

      - name: Check docs before artifact finalization
        if: inputs.artifact_role != 'canary' && steps.apply.outputs.changed_count != '0'
        run: npm run docs:check

      - name: Commit locale refresh
        id: locale_commit
        if: inputs.commit_locale && steps.apply.outputs.changed_count != '0'
        env:
          ARTIFACT_ROLE: ${{ inputs.artifact_role }}
          BASE_SOURCE_SHA: ${{ steps.apply.outputs.base_source_sha }}
          LOCALE: ${{ inputs.locale }}
          LOCALE_SLUG: ${{ inputs.locale_slug }}
          SHARD_INDEX: ${{ inputs.shard_index }}
          SHARD_TOTAL: ${{ inputs.shard_total }}
          ARTIFACT_DIR: .openclaw-sync/i18n-artifacts/${{ inputs.locale_slug }}-s${{ inputs.shard_index }}of${{ inputs.shard_total }}
        run: |
          set -euo pipefail

          python "${I18N_SCRIPT_DIR}/commit_locale_artifact.py"

      - name: Fail uncommitted locale refresh
        if: inputs.commit_locale && steps.apply.outputs.changed_count != '0' && steps.locale_commit.outputs.committed != 'true'
        run: |
          {
            echo "Locale artifact applied changes but did not commit them."
            echo "Failing so the translation status does not report an unpublished refresh as successful."
          } >&2
          exit 1

      - name: Dispatch locale docs deploy
        if: (inputs.artifact_role == 'canary' && inputs.canary_publish_required) || (inputs.commit_locale && steps.locale_commit.outputs.committed == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ROLE: ${{ inputs.artifact_role }}
          CANARY_LIVE_URL: https://docs.openclaw.ai/${{ inputs.locale }}/${{ inputs.canary_live_path }}
          CANARY_EXPECTED_H1: ${{ inputs.canary_expected_h1 }}
        run: |
          set -euo pipefail

          args=()
          if [ "${ARTIFACT_ROLE}" = "canary" ]; then
            args+=(
              --ref "${{ github.ref_name }}"
              --artifact-scope page
              --locale "${{ inputs.locale }}"
              --page-path "${{ inputs.canary_live_path }}"
              --no-force-upload
            )
            if [ "${{ inputs.canary_publish_required }}" = "true" ]; then
              args+=(
                --live-url "${CANARY_LIVE_URL}"
                --expect-h1 "${CANARY_EXPECTED_H1}"
              )
              python "${I18N_SCRIPT_DIR}/dispatch_r2_pages.py" "${args[@]}"
            elif ! python "${I18N_SCRIPT_DIR}/dispatch_r2_pages.py" "${args[@]}" --no-wait; then
              echo "::warning::Canary scoped R2 publish dispatch failed; continuing because final publication is covered by locale/full deploys."
            fi
          else
            args+=(
              --ref "${{ github.ref_name }}"
              --artifact-scope locale
              --locale "${{ inputs.locale }}"
              --no-force-upload
            )
            python "${I18N_SCRIPT_DIR}/dispatch_r2_pages.py" "${args[@]}"
          fi

      # STORY-06 (run 28273967200 stale-R2 lesson): a Pages dispatch alone
      # never proves R2 content landed. After the publish dispatch, compare
      # the live page h1 against the h1 derived from the applied artifact
      # page; when the no-wait lane skips waiting, record the explicit
      # unverified reason instead of claiming success.
      - name: Verify canary R2 content against artifact
        id: r2_smoke
        if: always() && inputs.mdx_repair_enabled == true && inputs.artifact_role == 'canary'
        env:
          LOCALE: ${{ inputs.locale }}
          CANARY_LIVE_URL: https://docs.openclaw.ai/${{ inputs.locale }}/${{ inputs.canary_live_path }}
          R2_SMOKE_REQUIRE_VERIFIED: ${{ inputs.canary_publish_required && '1' || '0' }}
          R2_SMOKE_UNVERIFIED_REASON: ${{ inputs.canary_publish_required && '' || 'dispatch_no_wait_final_publication_covered_by_locale_full_deploys' }}
        run: |
          python "${I18N_SCRIPT_DIR}/mdx_repair_canary.py" r2-smoke \
            --locale "${LOCALE}" \
            --page-path "${{ inputs.canary_live_path }}" \
            --live-url "${CANARY_LIVE_URL}" \
            --timeout-seconds 120 --poll-seconds 10

      # STORY-06 release notes (AC-03): repaired pages with repair_mode and
      # rounds, checker intercepted pages, failed pages, remaining risks, and
      # the explicit R2/Pages integrity record.
      - name: Record canary release summary
        id: release_summary
        if: always() && inputs.mdx_repair_enabled == true
        env:
          LOCALE: ${{ inputs.locale }}
          LOCALE_SLUG: ${{ inputs.locale_slug }}
          SHARD_INDEX: ${{ inputs.shard_index }}
          SHARD_TOTAL: ${{ inputs.shard_total }}
          ARTIFACT_DIR: .openclaw-sync/i18n-artifacts/${{ inputs.locale_slug }}-s${{ inputs.shard_index }}of${{ inputs.shard_total }}
          ARTIFACT_ROLE: ${{ inputs.artifact_role }}
          CANARY_GATE_FAILURE_POLICY: ${{ inputs.canary_gate_failure_policy }}
          GATE_DECISION: ${{ steps.mdx_release_gate.outputs.gate_decision || 'not_applicable' }}
          GATE_CLASSIFICATION: ${{ steps.mdx_release_gate.outputs.classification || '' }}
          GATE_REASON: ${{ steps.mdx_release_gate.outputs.reason || '' }}
          R2_SMOKE_OUTCOME: ${{ steps.r2_smoke.outputs.r2_smoke || '' }}
          R2_SMOKE_REASON: ${{ steps.r2_smoke.outputs.r2_smoke_reason || '' }}
          R2_SMOKE_EXPECTED_H1: ${{ steps.r2_smoke.outputs.expected_h1 || '' }}
          PAGES_DISPATCH_WAITED: ${{ (inputs.artifact_role == 'canary' && !inputs.canary_publish_required) && 'false' || 'true' }}
        run: |
          python "${I18N_SCRIPT_DIR}/mdx_repair_canary.py" summary \
            --artifact-dir "${ARTIFACT_DIR}"

      - name: Upload canary release summary evidence
        if: always() && inputs.mdx_repair_enabled == true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-canary-release-summary-${{ inputs.locale_slug }}-s${{ inputs.shard_index }}of${{ inputs.shard_total }}-${{ inputs.source_sha }}
          path: .openclaw-sync/canary-release-summary-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail incomplete locale artifact
        if: steps.apply.outputs.incomplete_count != '0'
        run: |
          {
            echo "Locale finalizer found missing or failed artifact data."
            cat .openclaw-sync/i18n-incomplete-locales.txt
          } >&2
          exit 1
